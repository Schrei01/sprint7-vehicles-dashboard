name: Execute EDA notebook

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/execute-eda.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  execute:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install notebook and dashboard dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt nbconvert nbclient ipykernel
      - name: Execute all notebook cells and save results
        run: python -m jupyter nbconvert --execute --to notebook --inplace notebooks/EDA.ipynb
      - name: Commit saved notebook outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add notebooks/EDA.ipynb
          if git diff --cached --quiet; then
            echo "Notebook outputs already up to date"
          else
            git commit -m "docs: save executed EDA notebook results"
            git push
          fi
