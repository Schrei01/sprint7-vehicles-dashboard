name: Prepare vehicles dataset

on:
  push:
    branches: [main]
    paths:
      - 'dataset_parts/**'
      - 'assemble_dataset.py'
      - '.github/workflows/prepare-dataset.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Create vehicles_us.csv
        run: python assemble_dataset.py
      - name: Commit dataset to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vehicles_us.csv
          if git diff --cached --quiet; then
            echo "CSV already committed"
          else
            git commit -m "data: add complete vehicles_us.csv dataset"
            git push
          fi
